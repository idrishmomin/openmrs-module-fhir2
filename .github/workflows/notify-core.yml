name: Notify openmrs-core to rebuild

# Copy this file into EACH module repo:
#   openmrs-module-webservices.rest/.github/workflows/notify-core.yml
#   openmrs-module-fhir2/.github/workflows/notify-core.yml
#   openmrs-module-reporting/.github/workflows/notify-core.yml
#
# Change EVENT_TYPE per repo (see below)

on:
  push:
    branches: [ "master", "main", "firstcommit" ]

jobs:
  notify:
    name: Trigger openmrs-core pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch to openmrs-core
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'idrishmomin',
              repo:  'openmrs-core',
              event_type: 'webservices-rest-updated',  // change per repo:
                                                        // fhir2    → 'fhir2-updated'
                                                        // reporting → 'reporting-updated'
              client_payload: {
                module: '${{ github.repository }}',
                sha:    '${{ github.sha }}',
                ref:    '${{ github.ref }}'
              }
            });
            console.log('Dispatched to openmrs-core successfully');